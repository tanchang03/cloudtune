<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    云韵 CloudTune — App 图标源文件。
    构成与设计原型 prototype/index.html 同源：
      底色 = 品牌主渐变 #5b8cff → #a45cff（135°）
      图形 = #i-note 双八分音符（连笔 + 两个符头）
      高光 = 原型 .p-cover .in 的左上径向光
    改颜色或图形改这里即可，PNG 用 rsvg-convert 重新导出：
      rsvg-convert -w 1024 -h 1024 assets/icon/app_icon.svg -o <目标>
  -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#A45CFF"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.30" cy="0.24" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- macOS 圆角比例 ≈ 0.2237 × 尺寸 -->
    <clipPath id="shape">
      <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229"/>
    </clipPath>
  </defs>

  <g clip-path="url(#shape)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#brand)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#sheen)"/>
    <!-- 音符：24 单位坐标系下居中放置（bbox 中心约 12,12.2） -->
    <g transform="translate(512 512) scale(29) translate(-12 -12.2)" fill="#FFFFFF">
      <path d="M9 18V6l10-2v12z"/>
      <circle cx="7" cy="18" r="2.4"/>
      <circle cx="17" cy="16" r="2.4"/>
    </g>
  </g>
</svg>
